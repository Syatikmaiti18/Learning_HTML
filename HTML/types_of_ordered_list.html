<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>types of ordered list</title>
</head>
<body>
    <ol type="i">
        <li>C programs</li>           
        <li>java programs</li>
        <li>c++ programs</li>
    </ol>

    <ol type = "A">
        <li>C programs</li>           
        <li>java programs</li>
        <li>c++ programs</li>
    </ol>

    <ol type = "a">
        <li>C programs</li>           
        <li>java programs</li>
        <li>c++ programs</li>
    </ol>

    <ol type = "I">
        <li>C programs</li>           
        <li>java programs</li>
        <li>c++ programs</li>
    </ol>

    <ol type = "1">
        <li>C programs</li>           
        <li>java programs</li>
        <li>c++ programs</li>
    </ol>
</body>
</html>
